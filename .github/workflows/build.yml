name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: dir
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          else
            unzip -q walkie-project.zip -d project
            echo "path=project" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        working-directory: ${{ steps.dir.outputs.path }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "${{ steps.dir.outputs.path }}/app/build/outputs/apk/release/app-release.apk" out/OfflineWalkie.apk
          cp "${{ steps.dir.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk" out/OfflineWalkie-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineWalkie-apk
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Offline Walkie build ${{ github.run_number }}
          files: out/*.apk
